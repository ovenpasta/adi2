name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl3-dev libsdl3-ttf-dev libsdl3-image-dev

      - uses: alire-project/setup-alire@v6

      - name: Build the library
        run: alr build -- -j0

      - name: Run the suite
        run: alr exec -- tools/run_tests.sh
