name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  #  Catches a vendored drop arriving unlicensed.
  reuse:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  test:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl3-dev libsdl3-ttf-dev libsdl3-image-dev

      - uses: alire-project/setup-alire@v6

      - name: Build the library
        run: alr build -- -j0

      - name: Run the suite
        run: alr exec -- tools/run_tests.sh

  #  The library and the Ada tests on Windows. The widget-tree goldens are
  #  left out: their runner looks for examples/bin/<name> and shells out
  #  to a .sh, neither of which holds there.
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: alire-project/setup-alire@v6

      - name: Build the library
        run: alr build -- -j0

      - name: Run the suite
        shell: bash
        env:
          PYTHON: python
          ADI_SKIP_TREE_GOLDENS: 1
        run: alr exec -- bash tools/run_tests.sh
