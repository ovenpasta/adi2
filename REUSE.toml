version = 1
SPDX-PackageName = "Adi2"
SPDX-PackageSupplier = "Aldo Nicolas Bruno <adi@aldustechnology.com>"
SPDX-PackageDownloadLocation = "https://github.com/ovenpasta/adi2"

#  Generated into adi2.spdx by `reuse spdx`. Later blocks narrow earlier
#  ones. Verify against the files themselves after editing: reuse checks
#  that a declaration exists, not that it is true.

#  ---- Adi2's own sources ----

[[annotations]]
path = ["src/**", "tests/**", "examples/**", "tools/**", "docs/**", "wasm/**", "config/**", "*.md", "*.gpr", "*.toml", "LICENSE", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aldo Nicolas Bruno"
SPDX-License-Identifier = "Apache-2.0"

#  Prose containing the word "Copyright"; without override, reuse scrapes
#  the sentences into the notice.
[[annotations]]
path = ["CONTRIBUTING.md", "examples/assets/NOTICE.md", "wasm/site/index.html"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Aldo Nicolas Bruno"
SPDX-License-Identifier = "Apache-2.0"

#  Harmony's wording, not ours; the file records this at its foot.
[[annotations]]
path = "CLA.md"
precedence = "override"
SPDX-FileCopyrightText = ["2011 Project Harmony", "2026 Aldo Nicolas Bruno"]
SPDX-License-Identifier = "CC-BY-3.0"

#  binary_to_ada.py output: the fonts and icons verbatim as byte arrays.
[[annotations]]
path = "examples/generated/assets_example_bundle.*"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Aldo Nicolas Bruno", "Google LLC", "2020 The Open Sans Project Authors (https://github.com/googlefonts/opensans)"]
SPDX-License-Identifier = "Apache-2.0 AND OFL-1.1"

[[annotations]]
path = [".gitattributes", ".gitignore", "deps/issues/*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aldo Nicolas Bruno"
SPDX-License-Identifier = "Apache-2.0"

#  Mechanical translations of the SDL3 / SDL3_ttf / SDL3_image C headers,
#  which are Zlib. Reference material, gitignored and not distributed; the
#  declaration stands in case that changes.
[[annotations]]
path = "bindings/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "1997-2025 Sam Lantinga <slouken@libsdl.org>"
SPDX-License-Identifier = "Zlib"

#  A diff against SDL_ttf: the context it carries stays under SDL's terms.
[[annotations]]
path = "deps/issues/*.patch"
precedence = "aggregate"
SPDX-FileCopyrightText = ["1997-2025 Sam Lantinga <slouken@libsdl.org>", "2026 Aldo Nicolas Bruno"]
SPDX-License-Identifier = "Zlib"

#  ---- vendor/json-ada ----

[[annotations]]
path = "vendor/json-ada/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 onox <denkpadje@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

#  ---- vendor/open-sans ----

[[annotations]]
path = "vendor/open-sans/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Open Sans Project Authors (https://github.com/googlefonts/opensans)"
SPDX-License-Identifier = "OFL-1.1"

#  ---- vendor/plutosvg ----

[[annotations]]
path = "vendor/plutosvg/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020-2026 Samuel Ugochukwu <sammycageagle@gmail.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/plutosvg/plutovg/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020-2025 Samuel Ugochukwu <sammycageagle@gmail.com>"
SPDX-License-Identifier = "MIT"

#  FreeType-derived rasteriser, stroker and fixed-point maths. plutovg
#  vendors its own FTL.TXT beside them.
[[annotations]]
path = "vendor/plutosvg/plutovg/source/plutovg-ft-*"
precedence = "aggregate"
SPDX-FileCopyrightText = "2000-2014 David Turner, Robert Wilhelm, and Werner Lemberg"
SPDX-License-Identifier = "FTL"

[[annotations]]
path = "vendor/plutosvg/plutovg/source/plutovg-stb-*"
precedence = "aggregate"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

#  ---- vendor/rlottie ----

[[annotations]]
path = "vendor/rlottie/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 rlottie contributors (see vendor/rlottie/AUTHORS)"
SPDX-License-Identifier = "MIT"

#  Upstream COPYING names the Skia licence for src/vector, but only
#  varenaalloc is Skia-derived; the rest is Samsung's under MIT.
[[annotations]]
path = "vendor/rlottie/src/vector/varenaalloc.*"
precedence = "override"
SPDX-FileCopyrightText = "2016 Google Inc."
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "vendor/rlottie/src/vector/freetype/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2000-2014 David Turner, Robert Wilhelm, and Werner Lemberg"
SPDX-License-Identifier = "FTL"

#  COPYING.PIX lists pixman's project-wide holders; the two files actually
#  vendored here are Nokia's, under plain MIT.
[[annotations]]
path = "vendor/rlottie/src/vector/pixman/**"
precedence = "override"
SPDX-FileCopyrightText = "2009 Nokia Corporation"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/rlottie/src/vector/stb/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

#  The only copyleft file in the tree. Distributing a build that contains
#  it obliges telling recipients how to obtain its source form.
[[annotations]]
path = "vendor/rlottie/src/vector/vinterpolator.cpp"
precedence = "aggregate"
SPDX-FileCopyrightText = "Mozilla Foundation and contributors"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "vendor/rlottie/src/lottie/rapidjson/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2015 THL A29 Limited, a Tencent company, and Milo Yip"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/rlottie/src/lottie/rapidjson/msinttypes/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2006-2013 Alexander Chemeris"
SPDX-License-Identifier = "BSD-3-Clause"

#  Only miniz carries a notice; zip.cpp/zip.h have none and fall under
#  rlottie's own MIT above.
[[annotations]]
path = "vendor/rlottie/src/lottie/zip/miniz.h"
precedence = "override"
SPDX-FileCopyrightText = ["2013-2014 RAD Game Tools and Valve Software", "2010-2014 Rich Geldreich and Tenacious Software LLC", "2016 Martin Raiber"]
SPDX-License-Identifier = "MIT OR Unlicense"

#  ---- example assets (demonstration content, bundled into binaries) ----

[[annotations]]
path = "examples/assets/noto_*.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "examples/assets/icons.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "examples/assets/animhorse.gif"
precedence = "aggregate"
SPDX-FileCopyrightText = "2005 Janke (https://commons.wikimedia.org/wiki/User:Janke)"
SPDX-License-Identifier = "CC-BY-SA-2.5"

[[annotations]]
path = ["examples/assets/camera.svg", "tests/assets/camera.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "AJ Ashton (https://openclipart.org/)"
SPDX-License-Identifier = "CC-PDDC"

[[annotations]]
path = ["examples/assets/tiger.svg", "tests/assets/tiger.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "microugly (https://openclipart.org/detail/176055/Clipart-by-microugly)"
SPDX-License-Identifier = "CC-PDDC"

[[annotations]]
path = "examples/assets/OpenSans-Regular.ttf"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The Open Sans Project Authors (https://github.com/googlefonts/opensans)"
SPDX-License-Identifier = "OFL-1.1"
