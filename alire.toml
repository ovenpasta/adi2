name = "adi2"
description = "A modern GUI library for Ada: CSS styling, XML UI, SDL3"
version = "0.9.0"

authors = ["Aldo Nicolas Bruno"]
maintainers = ["Aldo Nicolas Bruno <ovenpasta@pizzahack.eu>"]
licenses = "Apache-2.0"
website = "https://github.com/ovenpasta/adi2"
tags = ["gui", "sdl", "widgets", "css", "ui", "graphics"]
project-files = ["adi.gpr"]

[[actions]]
type = "test"
command = ["bash", "tools/run_tests.sh"]

#  Where the code generators live, so a project using Adi2 can run them
#  on its own CSS and XML without knowing Alire's cache layout:
#      alr exec -- sh -c 'python3 "$ADI2_TOOLS/xml_to_ada.py" ...'
#  The inner shell is what expands it: alr exec sets the variable for
#  the command it runs, not for the shell that typed it.
[environment]
ADI2_TOOLS.set = "${CRATE_ROOT}/tools"

[build-switches]
"*".style_checks = "No"
