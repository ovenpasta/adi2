name = "adi"
description = "The Adi GUI Library"
version = "0.1.0-dev"

authors = ["Aldo Nicolas Bruno"]
maintainers = ["Aldo Nicolas Bruno <ovenpasta@pizzahack.eu>"]
licenses = "custom-proprietary"
website = ""
tags = ["gui"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "tests/tests.gpr", "-XTEST_KIND=styles"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=demo_flex"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "tests/tests.gpr", "-XTEST_KIND=layout_test"]

[[actions]]
type = "post-build"
command = ["bash", "tools/generate_example_styles.sh"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=label_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=widget_demo"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=button_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=transition_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=text_input_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=stack_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=list_box_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=combo_box_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=overflow_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=grid_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=dialog_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=font_example"]

[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "examples/examples.gpr", "-XEXAMPLE_KIND=text_editor_example"]

[[actions]]
