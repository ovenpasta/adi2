name = "demos"
description = "Demo applications for the Adi GUI library"
version = "0.1.0-dev"

authors = ["Your Name"]
maintainers = ["Your Name <example@example.com>"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = ""
tags = []

project-files = ["demos.gpr"]
executables = [
    "label_example",
    "button_example",
    "transition_example",
    "text_input_example",
    "text_editor_example",
    "demo_flex",
    "demo_block",
    "stack_example",
    "list_box_example",
    "combo_box_example",
    "overflow_example",
    "grid_example",
    "dialog_example",
    "font_example",
    "runtime_css_example",
    "animated_image_example",
    "rlottie_example",
    "html_view_example",
    "material_demo",
    "image_example",
    "slider_example",
    "value_input_example",
    "assets_example",
    "gradient_example",
    "hello_example",
    "hello_raw_example",
    "svg_example",
]

[[depends-on]]
adi2 = "*"

[[pins]]
adi2 = { path = ".." }

[[actions]]
type = "pre-build"
command = ["bash", "../tools/generate_demos.sh"]

# Demo strings carry UTF-8 bytes in String, matching the library's convention.
[build-switches]
"*".source_encoding = ["-gnatWb"]
"*".style_checks = "No"
