<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Colored cat icon">
  <title>Colored Cat Icon</title>

  <!-- Tail -->
  <path d="M96 78 
           C116 70, 120 96, 100 104 
           C118 98, 122 120, 96 116"
        fill="none"
        stroke="#B5651D"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="64" cy="82" rx="36" ry="28"
           fill="#F4A261"
           stroke="#B5651D"
           stroke-width="4"/>

  <!-- Head -->
  <circle cx="64" cy="50" r="26"
          fill="#F4A261"
          stroke="#B5651D"
          stroke-width="4"/>

  <!-- Ears -->
  <path d="M42 32 L50 12 L58 30 Z"
        fill="#F4A261"
        stroke="#B5651D"
        stroke-width="4"
        stroke-linejoin="round"/>
  <path d="M86 32 L78 12 L70 30 Z"
        fill="#F4A261"
        stroke="#B5651D"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Inner Ears -->
  <path d="M48 28 L50 18 L54 28 Z"
        fill="#F7CAD0"/>
  <path d="M80 28 L78 18 L74 28 Z"
        fill="#F7CAD0"/>

  <!-- Eyes -->
  <ellipse cx="54" cy="50" rx="5" ry="7" fill="#2A9D8F"/>
  <ellipse cx="74" cy="50" rx="5" ry="7" fill="#2A9D8F"/>
  <ellipse cx="54" cy="52" rx="2" ry="4" fill="#1B1B1B"/>
  <ellipse cx="74" cy="52" rx="2" ry="4" fill="#1B1B1B"/>

  <!-- Nose -->
  <polygon points="64,58 60,64 68,64"
           fill="#E76F51"/>

  <!-- Mouth -->
  <path d="M64 64 
           C60 70, 54 72, 48 70"
        fill="none"
        stroke="#8B3E2F"
        stroke-width="3"
        stroke-linecap="round"/>
  <path d="M64 64 
           C68 70, 74 72, 80 70"
        fill="none"
        stroke="#8B3E2F"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="40" y1="60" x2="20" y2="58"
        stroke="#8B3E2F"
        stroke-width="3"
        stroke-linecap="round"/>
  <line x1="40" y1="66" x2="18" y2="66"
        stroke="#8B3E2F"
        stroke-width="3"
        stroke-linecap="round"/>
  <line x1="88" y1="60" x2="108" y2="58"
        stroke="#8B3E2F"
        stroke-width="3"
        stroke-linecap="round"/>
  <line x1="88" y1="66" x2="110" y2="66"
        stroke="#8B3E2F"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Paws -->
  <ellipse cx="50" cy="104" rx="10" ry="8"
           fill="#F4A261"
           stroke="#B5651D"
           stroke-width="3"/>
  <ellipse cx="78" cy="104" rx="10" ry="8"
           fill="#F4A261"
           stroke="#B5651D"
           stroke-width="3"/>

</svg>
