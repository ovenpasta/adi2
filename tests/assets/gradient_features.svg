<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="base" x1="0" y1="10" x2="120" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#0000ff"/>
    </linearGradient>

    <linearGradient id="derived" href="#base" gradientTransform="translate(10,0)"/>

    <radialGradient id="rad" cx="60" cy="60" r="12" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="120" height="20" fill="url(#base)"/>
  <rect x="0" y="20" width="120" height="20" fill="url(#derived)"/>
  <circle cx="60" cy="60" r="18" fill="url(#rad)"/>
</svg>
