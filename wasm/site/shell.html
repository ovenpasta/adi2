<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adi2 example</title>
<style>
  html, body { margin: 0; background: #f5f7fa; font-family: system-ui, sans-serif; }
  #canvas-holder { display: flex; justify-content: center; padding: 0.5rem 1rem 1rem; }
  canvas { background: transparent; max-width: 100%; }
  #output-holder { max-width: 60rem; margin: 0 auto 1rem; padding: 0 1rem; }
  #output {
    width: 100%; box-sizing: border-box; resize: vertical;
    font-family: ui-monospace, monospace; font-size: 0.75rem;
    color: #363636; background: #fff;
    border: 1px solid #dbdbdb; border-radius: 4px; padding: 0.5rem;
  }
</style>
</head>
<body>

<div id="canvas-holder">
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
</div>

<div id="output-holder">
  <textarea id="output" rows="6" readonly placeholder="program log"></textarea>
</div>

<script>
  //  Reached directly, not through the navigator: send old per-example
  //  bookmarks to the outer page so they keep their switcher. Single-example
  //  builds have no index.html, so redirect only once it is known to exist.
  if (window.top === window.self) {
    var self_name = location.pathname.split('/').pop().replace(/\.html$/, '');
    fetch('index.html', { method: 'HEAD' }).then(function (r) {
      if (r.ok) {
        location.replace('index.html?example=' + encodeURIComponent(self_name));
      }
    }).catch(function () {});
  }

  var outputElement = document.getElementById('output');

  function report(text) {
    if (window.parent !== window) {
      window.parent.postMessage({ adi: 'status', text: text }, location.origin);
    }
  }

  var Module = {
    print: function () {
      var text = Array.prototype.join.call(arguments, ' ');
      console.log(text);
      if (outputElement) {
        outputElement.value += text + '\n';
        outputElement.scrollTop = outputElement.scrollHeight;
      }
    },
    canvas: (function () {
      var c = document.getElementById('canvas');
      c.addEventListener('webglcontextlost', function (e) {
        report('graphics context lost — reload the page');
        e.preventDefault();
      }, false);
      return c;
    })(),
    setStatus: report,
    monitorRunDependencies: function (left) { report(left ? 'loading…' : ''); }
  };
  Module.printErr = Module.print;
  window.onerror = function () { report('error — see JS console'); };
</script>
{{{ SCRIPT }}}
</body>
</html>
